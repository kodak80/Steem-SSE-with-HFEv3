name: Windows build

# Builds Steem SSE (Steem-D3D-Release, x64 and Win32) with Steem.vcxproj,
# the project the Steem SSE author makes releases with (its settings match
# the VS2008 release configurations), using the VS2019 toolset (v142) like
# the author, or v143 if the runner doesn't have v142.
# Pushing a tag starting with "v", or a branch named release/<tag>, also
# publishes a GitHub release named after the tag: a pre-release when the
# name contains "test"; a final release also deletes the test releases.

on:
  push:
    branches: [ main, hfev3, 'release/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DXSDK_URL: https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe
  DXSDK_DIR: C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, Win32 ]
    steps:
      - uses: actions/checkout@v4

      - name: Cache DirectX SDK (June 2010)
        id: dxcache
        uses: actions/cache@v4
        with:
          path: dxsdk
          key: dxsdk-jun2010-headers-libs

      - name: Download DirectX SDK (June 2010)
        if: steps.dxcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest $env:DXSDK_URL -OutFile DXSDK_Jun10.exe
          7z x DXSDK_Jun10.exe DXSDK/Include -odxsdk -y | Out-Null
          7z x DXSDK_Jun10.exe DXSDK/Lib -odxsdk -y | Out-Null
          Get-ChildItem dxsdk\DXSDK

      - name: Install DirectX SDK headers and libs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:DXSDK_DIR" | Out-Null
          Copy-Item -Recurse -Force dxsdk\DXSDK\* "$env:DXSDK_DIR"
          # DirectMusic headers were dropped from DirectX SDKs after 2007;
          # Steem bundles the ones it needs with DirectMidi
          foreach ($h in 'dmusici.h','dmplugin.h','dxerr9.h') {
            Copy-Item -Force "3rdparty\directmidi\$h" "$($env:DXSDK_DIR)Include\"
          }
          # Steem.vcxproj puts this path before the Windows SDK, so it only
          # gets headers the Windows SDK lacks (old DXGI headers there would
          # break the Windows SDK's own)
          $legacy = "C:\Program Files\Microsoft DirectX SDK\Include"
          New-Item -ItemType Directory -Force -Path $legacy | Out-Null
          Copy-Item -Force "$($env:DXSDK_DIR)Include\d3dx9*" $legacy
          foreach ($h in 'dmusici.h','dmplugin.h','dxerr9.h') {
            Copy-Item -Force "3rdparty\directmidi\$h" $legacy
          }
          Get-ChildItem $legacy
          Get-ChildItem "$env:DXSDK_DIR"

      - name: Install VS2019 (v142) build tools
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -Wait -PassThru -FilePath "$installer\vs_installer.exe" -ArgumentList @(
            'modify', '--installPath', "`"$vs`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.v142.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL',
            '--quiet', '--norestart', '--nocache')
          $ts = (Get-ChildItem "$vs\MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets" -Directory -ErrorAction SilentlyContinue |
                 ForEach-Object { Get-ChildItem $_.FullName -Directory } | ForEach-Object { $_.Parent.Parent.Parent.Parent.Name + '/' + $_.Name }) -join ', '
          Write-Output "::notice title=vs_installer::exit $($p.ExitCode); toolsets: $ts"

      - uses: microsoft/setup-msbuild@v2

      - name: Build Steem-D3D-Release ${{ matrix.platform }}
        shell: pwsh
        run: |
          $toolset = 'v142'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not (Get-ChildItem "$vs\MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\v142" -ErrorAction SilentlyContinue)) { $toolset = 'v143' }
          Write-Output "Toolset: $toolset"
          Write-Output "::notice title=Toolset (${{ matrix.platform }})::$toolset"
          # HFEv3 version shown in Steem's build info: the part of the release
          # name after "-hfev3-" (v4.2.1-hfev3-2 -> 2), else dev-<commit>.
          # CL can't contain '=', cl.exe accepts '#' instead.
          $ver = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          $name = $env:GITHUB_REF_NAME -replace '^release/',''
          if (($env:GITHUB_REF -like 'refs/heads/release/*' -or $env:GITHUB_REF -like 'refs/tags/*') -and $name -match '-hfev3-(.+)$') { $ver = $Matches[1] }
          $env:CL = "/DHFEV3_VER#$ver"
          Write-Output "::notice title=HFEv3 version (${{ matrix.platform }})::$ver"
          msbuild windows-build\VS2019\Steem.vcxproj `
            /m /nologo /v:minimal `
            /p:Configuration=Steem-D3D-Release `
            /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=$toolset `
            /p:PostBuildEventUseInBuild=false `
            /p:TreatWarningAsError=false `
            "/flp:logfile=build.log;verbosity=normal"
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            # report errors as one annotation so they're visible without
            # downloading the log
            $err = Select-String -Path build.log -Pattern ': (fatal )?error |error MSB|error LNK' |
                   ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 40
            $msg = ($err -join "`n") -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Output "::error title=Build errors (${{ matrix.platform }})::$msg"
          }
          exit $rc

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path windows-build -Filter *.exe |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "No executable produced" }
          Write-Host "Built $($exe.FullName)"
          $suffix = if ('${{ matrix.platform }}' -eq 'x64') { '64' } else { '32' }
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item $exe.FullName "pkg\Steem$suffix-HFEv3.exe"
          Copy-Item release-notes-hfev3.txt pkg\README-HFEv3.txt
          Copy-Item gpl-3.0.txt pkg\
          Compress-Archive -Path pkg\* -DestinationPath "Steem-SSE-HFEv3-${{ matrix.platform }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Steem-SSE-HFEv3-${{ matrix.platform }}
          path: Steem-SSE-HFEv3-${{ matrix.platform }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          PRE=""
          case "$TAG" in *test*) PRE="--prerelease";; esac
          # republishing a release replaces it (and moves its tag to this commit)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Replacing existing release $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Steem SSE 4.2.1 with HFEv3 support ($TAG)" \
            --notes-file release-notes-hfev3.txt \
            $PRE

      - name: Remove test releases after a final release
        if: ${{ !contains(github.ref_name, 'test') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -- '-test'); do
            echo "Deleting test release $t"
            gh release delete "$t" --yes --cleanup-tag
            git push origin --delete "release/$t" 2>/dev/null || true
          done
